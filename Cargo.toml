[package]
name = "transcriptor"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
opus-decoder = "0.1"
serde_json = "1.0"
symphonia = { version = "0.6", features = ["aac", "isomp4", "mp3"] }
ureq = "2.12"
whisper-rs = "0.16"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
